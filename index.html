<p id="signupMessage" role="status"
   style="margin-top:14px;color:#fff0bd;"></p>

    <div class="signup-divider">OR</div>

    <button type="button" id="googleSignIn" class="social-btn">
  Continue with Google
</button>

    <button type="button" class="social-btn">
      Continue with Facebook
    </button>

  </div>
</div>
<script>
(function () {
  const overlay = document.getElementById("signupOverlay");
  const skipButton = document.getElementById("skipSignup");
  const storageKey = "mahi_signup_seen";

  if (!overlay || !skipButton) return;

  function closeSignup() {
    overlay.style.display = "none";
  }

  let remaining = 60;
  skipButton.textContent = "Skip (" + remaining + ")";

  const countdown = setInterval(function () {
    remaining--;

    skipButton.textContent = "Skip (" + remaining + ")";

    if (remaining <= 0) {
      clearInterval(countdown);
      closeSignup();
    }
  }, 1000);

  skipButton.addEventListener("click", function () {
    clearInterval(countdown);
    closeSignup();
  });
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgcnH4k9fdl3M5r9qNzUk9fsQjfB5fZsw",
  authDomain: "mahi-stastilogical.firebaseapp.com",
  projectId: "mahi-stastilogical",
  storageBucket: "mahi-stastilogical.firebasestorage.app",
  messagingSenderId: "715808615130",
  appId: "1:715808615130:web:8d2858b25e1c6df9ed93e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("signupForm");
const overlay = document.getElementById("signupOverlay");
const message = document.getElementById("signupMessage");
const button = document.getElementById("createAccountButton");
const googleButton = document.getElementById("googleSignIn");
const googleProvider = new GoogleAuthProvider();

googleButton.addEventListener("click", async () => {
  try {
    message.textContent = "Opening Google sign-in...";

    await signInWithPopup(auth, googleProvider);

    message.textContent = "Google sign-in successful!";
    overlay.style.display = "none";

  } catch (error) {
    message.textContent = error.message;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user && overlay) {
    overlay.style.display = "none";
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  button.disabled = true;
  button.textContent = "CREATING ACCOUNT...";
  message.textContent = "Please wait...";

  try {
    await createUserWithEmailAndPassword(auth, email, password);

    message.textContent = "Account created successfully!";
    overlay.style.display = "none";

  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "This email already has an account.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/weak-password": "Choose a stronger password.",
      "auth/operation-not-allowed": "Email registration is not enabled.",
      "auth/network-request-failed": "Check your internet connection."
    };

    message.textContent =
      errors[error.code] || "Registration failed. Please try again.";

    button.disabled = false;
    button.textContent = "CREATE ACCOUNT";
  }
});
</script>
</body>
</html>
